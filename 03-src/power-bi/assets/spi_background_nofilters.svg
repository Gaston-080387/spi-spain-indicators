<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-5%" y="-50%" width="110%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0E2F36" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Page background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F4F6F6"/>
  <!-- Side menu (220 px) -->
  <rect x="0" y="0" width="220" height="1080" fill="#0E2F36"/>
  <!-- SPI mark: three ascending bars, block aligned to the header (0-96 px) -->
  <rect x="28" y="40" width="10" height="18" rx="2" fill="#0F7B6C"/>
  <rect x="42" y="31" width="10" height="27" rx="2" fill="#E0A526"/>
  <rect x="56" y="22" width="10" height="36" rx="2" fill="#FFFFFF"/>
  <text x="76" y="58" font-family="Segoe UI Semibold, Segoe UI, Arial, sans-serif" font-size="36" fill="#FFFFFF" letter-spacing="2">SPI</text>
  <text x="28" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9FB8BC" letter-spacing="0.8">SPAIN PUBLIC INDICATORS</text>
  <!-- Saffron line aligned with the header divider -->
  <rect x="28" y="94" width="164" height="2" fill="#E0A526"/>
  <!-- Header (96 px) -->
  <rect x="220" y="0" width="1700" height="96" fill="#FFFFFF"/>
  <rect x="220" y="95" width="1700" height="1" fill="#DDE3E6"/>
</svg>
